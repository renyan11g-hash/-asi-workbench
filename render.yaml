services:
  # Single service hosting both backend API and frontend static files
  - type: web
    name: asi-workbench
    env: node
    plan: free
    buildCommand: |
      cd backend && npm install && npm run build
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /tmp/data
      - key: CORS_ORIGIN
        value: "*"
      # Turso 云数据库：在 Render Dashboard 填入实际值（数据持久化必需）
      - key: LIBSQL_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
    healthCheckPath: /api/health
