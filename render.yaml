services:
  # Single service hosting both backend API and frontend static files
  - type: web
    name: asi-workbench
    env: node
    plan: free
    buildCommand: |
      cd backend && npm install && npm run build
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATA_DIR
        value: /tmp/data
      - key: CORS_ORIGIN
        value: https://asi-workbench.onrender.com
      # 注：已收紧为自有域名（原来是 *）。若以后绑定自定义域名，这里和 Render 的
      # 环境变量都要同步改成新域名，否则前端跨域请求会被浏览器拦掉。
      # Turso 云数据库：在 Render Dashboard 填入实际值（数据持久化必需）
      - key: LIBSQL_URL
        sync: false
      - key: LIBSQL_AUTH_TOKEN
        sync: false
      # 访问保护（HTTP Basic Auth）：在 Render Dashboard 填任意用户名 + 强密码。
      # 两项都填 = 全站需要登录；两项留空 = 不鉴权。改完需重新部署生效。
      - key: BASIC_AUTH_USER
        sync: false
      - key: BASIC_AUTH_PASS
        sync: false
    healthCheckPath: /api/health
